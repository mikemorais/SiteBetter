<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BETTER. — Sistema de Demandas</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap');

:root {
  --carvao: #1E1E1C;
  --areia: #C8B89A;
  --offwhite: #F5F4F0;
  --branco: #FFFFFF;
  --grafite: #6B6B62;
  --sage: #3D7A5E;
  --sage-lt: rgba(61,122,94,0.10);
  --areia-lt: rgba(200,184,154,0.15);
  --borda: rgba(30,30,28,0.10);
  --verde: #2D7A4F;
  --verde-bg: rgba(45,122,79,0.09);
  --amarelo: #9A7000;
  --amarelo-bg: rgba(154,112,0,0.09);
  --vermelho: #9B2E2E;
  --vermelho-bg: rgba(155,46,46,0.09);
  --azul: #2E5F9B;
  --azul-bg: rgba(46,95,155,0.09);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--offwhite);
  color: var(--carvao);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ─── LOGIN SCREEN ─── */
.login-screen {
  position: fixed; inset: 0;
  background: var(--carvao);
  display: flex; align-items: center; justify-content: center;
  z-index: 2000;
}
.login-box { width: 300px; text-align: center; }
.login-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 44px;
  text-transform: uppercase; color: var(--branco);
  letter-spacing: -0.01em; line-height: 1;
}
.login-logo span { color: var(--areia); }
.login-sub {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(200,184,154,0.6);
  margin: 6px 0 24px;
}
.login-input {
  width: 100%;
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  padding: 11px 14px;
  border-radius: 4px;
  border: 0.5px solid rgba(200,184,154,0.3);
  background: rgba(255,255,255,0.04);
  color: var(--branco);
  outline: none; text-align: center;
  transition: border-color 0.15s;
}
.login-input:focus { border-color: var(--sage); }
.login-input::placeholder { color: rgba(245,244,240,0.3); }
.login-btn {
  width: 100%; margin-top: 10px;
  font-family: 'Barlow', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
  padding: 11px; border-radius: 4px;
  border: none; background: var(--sage); color: var(--branco);
  cursor: pointer; transition: background 0.15s;
}
.login-btn:hover { background: #336950; }
.login-btn:disabled { opacity: 0.5; cursor: wait; }
.login-msg { font-size: 11.5px; margin-top: 12px; min-height: 16px; color: rgba(245,244,240,0.5); }
.login-msg.erro { color: #d98080; }

/* ─── TOPBAR ─── */
.topbar {
  background: var(--carvao);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 22px;
  text-transform: uppercase;
  color: var(--branco);
  letter-spacing: 0.01em;
  flex-shrink: 0;
}
.topbar-logo span { color: var(--areia); }
.topbar-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(200,184,154,0.6);
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.day-badge {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--areia);
  border: 0.5px solid rgba(200,184,154,0.3);
  padding: 4px 10px;
  border-radius: 3px;
}

/* ─── SYNC INDICATOR ─── */
.sync-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(245,244,240,0.45);
}
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--grafite); }
.sync-badge.ok .sync-dot { background: var(--sage); }
.sync-badge.syncing .sync-dot { background: var(--amarelo); animation: pulse 1s infinite; }
.sync-badge.err .sync-dot { background: var(--vermelho); }
@keyframes pulse { 50% { opacity: 0.3; } }

/* ─── GOOGLE CALENDAR AUTH ─── */
.gcal-btn {
  font-family: 'Barlow', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: 3px;
  border: 0.5px solid rgba(200,184,154,0.3);
  background: transparent;
  color: var(--areia);
  cursor: pointer;
  transition: all 0.12s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.gcal-btn:hover { border-color: var(--sage); color: var(--sage); }
.gcal-btn.connected {
  background: var(--sage-lt);
  border-color: var(--sage);
  color: var(--sage);
}
.gcal-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--grafite); flex-shrink: 0; }
.gcal-btn.connected .gcal-dot { background: var(--sage); }

/* ─── CALENDAR TOGGLE ON CARDS ─── */
.dc-cal-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--grafite);
  cursor: pointer;
  padding: 6px 14px;
  border-top: 0.5px solid var(--borda);
  background: rgba(46,95,155,0.03);
  transition: background 0.12s;
  user-select: none;
}
.dc-cal-toggle:hover { background: rgba(46,95,155,0.06); }
.dc-cal-checkbox {
  width: 14px; height: 14px;
  border-radius: 3px;
  border: 1.5px solid var(--borda);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.dc-cal-checkbox.checked { background: var(--azul); border-color: var(--azul); }
.dc-cal-checkbox.checked::after { content: '✓'; color: white; font-size: 9px; font-weight: 700; }
.dc-cal-toggle.in-cal { color: var(--azul); }

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(30,30,28,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.modal-box {
  background: var(--branco);
  border-radius: 8px;
  padding: 20px;
  width: 280px;
  box-shadow: 0 8px 32px rgba(30,30,28,0.2);
}
.modal-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 14px;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--carvao); margin-bottom: 4px;
}
.modal-subtitle { font-size: 12px; color: var(--grafite); margin-bottom: 14px; }
.modal-row { margin-bottom: 12px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-btn {
  flex: 1;
  font-family: 'Barlow', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 9px; border-radius: 4px; cursor: pointer;
  transition: background 0.12s;
}
.modal-btn.cancel { background: transparent; border: 0.5px solid var(--borda); color: var(--grafite); }
.modal-btn.cancel:hover { border-color: var(--vermelho); color: var(--vermelho); }
.modal-btn.confirm { background: var(--azul); border: none; color: var(--branco); }
.modal-btn.confirm:hover { background: #244e80; }
.modal-btn.danger { background: var(--vermelho); border: none; color: var(--branco); }

/* ─── DATE NAVIGATION ─── */
.date-bar {
  background: var(--branco);
  border-bottom: 0.5px solid var(--borda);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.date-nav-btn {
  width: 30px; height: 30px;
  border-radius: 4px;
  border: 0.5px solid var(--borda);
  background: var(--branco);
  color: var(--carvao);
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
  flex-shrink: 0;
}
.date-nav-btn:hover { border-color: var(--sage); color: var(--sage); }
.date-current {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 15px;
  text-transform: capitalize;
  color: var(--carvao);
  flex: 1; text-align: center; min-width: 140px;
  cursor: pointer; padding: 4px 8px; border-radius: 4px;
  transition: background 0.12s;
}
.date-current:hover { background: var(--areia-lt); }
.date-current .date-year { font-size: 11px; font-weight: 600; color: var(--grafite); margin-left: 4px; }
#datePicker { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
.btn-today {
  font-family: 'Barlow', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 7px 12px; border-radius: 4px;
  border: 0.5px solid var(--borda);
  background: transparent; color: var(--grafite);
  cursor: pointer; transition: all 0.12s; flex-shrink: 0;
}
.btn-today:hover { border-color: var(--sage); color: var(--sage); }
.btn-today.is-today { border-color: var(--sage); color: var(--sage); background: var(--sage-lt); }

/* ─── PERSON FILTER ─── */
.filter-bar {
  background: var(--branco);
  border-bottom: 0.5px solid var(--borda);
  padding: 10px 20px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.filter-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--grafite); margin-right: 4px;
}
.filter-btn {
  font-family: 'Barlow', sans-serif;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 6px 14px; border-radius: 3px;
  border: 0.5px solid var(--borda);
  background: transparent; color: var(--grafite);
  cursor: pointer; transition: all 0.14s;
}
.filter-btn:hover { border-color: var(--sage); color: var(--sage); }
.filter-btn.active-all { background: var(--carvao); border-color: var(--carvao); color: var(--branco); }
.filter-btn.active-mike { background: var(--carvao); border-color: var(--carvao); color: var(--branco); }
.filter-btn.active-leonam { background: var(--sage); border-color: var(--sage); color: var(--branco); }
.filter-btn.active-beatriz { background: #8a7558; border-color: #8a7558; color: var(--branco); }

/* ─── LAYOUT ─── */
.layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 0;
  min-height: calc(100vh - 92px);
}
.main { padding: 20px; border-right: 0.5px solid var(--borda); overflow-y: auto; }

/* ─── SECTION HEADER ─── */
.sec-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; margin-top: 24px;
}
.sec-header:first-child { margin-top: 0; }
.sec-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 13px;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--grafite);
  display: flex; align-items: center; gap: 8px;
}
.sec-title::before { content: ''; display: block; width: 20px; height: 1.5px; background: var(--areia); }
.sec-count {
  font-size: 10px; font-weight: 600;
  background: var(--areia-lt); color: #8a7558;
  padding: 2px 8px; border-radius: 20px;
}

/* ─── DEMAND CARD ─── */
.demand-card {
  background: var(--branco);
  border: 0.5px solid var(--borda);
  border-radius: 6px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: box-shadow 0.14s;
}
.demand-card:hover { box-shadow: 0 2px 8px rgba(30,30,28,0.07); }
.demand-card.status-done { opacity: 0.6; }
.demand-card.status-done .dc-title { text-decoration: line-through; color: var(--grafite); }
.demand-card.status-waiting { border-left: 3px solid var(--amarelo); }
.demand-card.status-late    { border-left: 3px solid var(--vermelho); }
.demand-card.status-done    { border-left: 3px solid var(--verde); }
.demand-card.status-pending { border-left: 3px solid var(--borda); }

.dc-main { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; }
.dc-checkbox {
  width: 18px; height: 18px;
  border-radius: 3px;
  border: 1.5px solid var(--borda);
  flex-shrink: 0; margin-top: 1px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
  background: transparent;
}
.dc-checkbox:hover { border-color: var(--sage); }
.dc-checkbox.checked { background: var(--verde); border-color: var(--verde); }
.dc-checkbox.checked::after { content: '✓'; color: white; font-size: 11px; font-weight: 700; }
.dc-checkbox.disabled { cursor: not-allowed; opacity: 0.4; }

.dc-body { flex: 1; min-width: 0; }
.dc-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
.dc-who {
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 2px;
}
.who-mike    { background: var(--carvao); color: var(--branco); }
.who-leonam  { background: var(--sage-lt); color: var(--sage); }
.who-beatriz { background: var(--areia-lt); color: #8a7558; }
.dc-area {
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--grafite);
}
.dc-due { font-size: 10px; font-weight: 600; color: var(--grafite); }
.dc-due.passed { color: var(--vermelho); }
.dc-origin {
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--vermelho-bg); color: var(--vermelho);
  padding: 2px 7px; border-radius: 2px;
}
.dc-title { font-size: 13.5px; font-weight: 600; color: var(--carvao); line-height: 1.35; margin-bottom: 3px; }
.dc-desc { font-size: 12px; color: var(--grafite); line-height: 1.4; }
.dc-del {
  margin-left: auto;
  width: 18px; height: 18px;
  border-radius: 3px;
  border: none; background: transparent;
  color: var(--grafite); font-size: 13px; line-height: 1;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.12s;
}
.dc-del:hover { background: var(--vermelho-bg); color: var(--vermelho); }

/* ─── CHAIN ─── */
.dc-chain {
  padding: 8px 14px;
  background: rgba(30,30,28,0.025);
  border-top: 0.5px solid var(--borda);
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--grafite);
}
.chain-arrow { color: var(--areia); font-size: 13px; }
.chain-next-who {
  font-weight: 700; font-size: 10px;
  letter-spacing: 0.10em; text-transform: uppercase;
}
.chain-next-who.mike    { color: var(--carvao); }
.chain-next-who.leonam  { color: var(--sage); }
.chain-next-who.beatriz { color: #8a7558; }

/* ─── STATUS BADGE ─── */
.status-badge {
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.10em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 2px;
}
.sb-pending  { background: var(--areia-lt); color: #8a7558; }
.sb-waiting  { background: var(--amarelo-bg); color: var(--amarelo); }
.sb-late     { background: var(--vermelho-bg); color: var(--vermelho); }
.sb-done     { background: var(--verde-bg); color: var(--verde); }

/* ─── SIDEBAR ─── */
.sidebar { padding: 20px; background: var(--branco); overflow-y: auto; }
.sidebar-section { margin-bottom: 24px; }
.sidebar-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 13px;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--grafite); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.sidebar-title::before { content: ''; display: block; width: 16px; height: 1.5px; background: var(--areia); }

/* ─── ALERTS ─── */
.alert-item {
  display: flex; gap: 10px;
  padding: 10px 12px;
  border-radius: 5px; margin-bottom: 6px;
  font-size: 12px; line-height: 1.4;
}
.alert-late     { background: var(--vermelho-bg); border-left: 3px solid var(--vermelho); }
.alert-waiting  { background: var(--amarelo-bg); border-left: 3px solid var(--amarelo); }
.alert-ok       { background: var(--verde-bg); border-left: 3px solid var(--verde); }
.alert-15h      { background: var(--areia-lt); border-left: 3px solid var(--areia); }
.alert-icon { font-size: 14px; flex-shrink: 0; }
.alert-text strong { display: block; font-weight: 600; margin-bottom: 2px; }

/* ─── FORM ─── */
.new-demand-form {
  background: var(--offwhite);
  border: 0.5px solid var(--borda);
  border-radius: 6px;
  padding: 14px;
}
.form-row { margin-bottom: 10px; }
.form-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--grafite); margin-bottom: 5px; display: block;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  font-family: 'Barlow', sans-serif;
  font-size: 12.5px;
  padding: 7px 10px;
  border: 0.5px solid var(--borda);
  border-radius: 4px;
  background: var(--branco);
  color: var(--carvao);
  outline: none;
  transition: border-color 0.12s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--sage); }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-add {
  width: 100%;
  font-family: 'Barlow', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 9px; border-radius: 4px;
  border: none; background: var(--carvao); color: var(--branco);
  cursor: pointer; transition: background 0.12s; margin-top: 4px;
}
.btn-add:hover { background: #2d2d2a; }

/* ─── STATS ─── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--borda);
  border: 0.5px solid var(--borda);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 20px;
}
.stat-cell { background: var(--branco); padding: 10px 12px; text-align: center; }
.stat-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 26px; line-height: 1;
  color: var(--carvao);
}
.stat-num.red { color: var(--vermelho); }
.stat-num.yellow { color: var(--amarelo); }
.stat-num.green { color: var(--verde); }
.stat-lbl {
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--grafite); margin-top: 2px;
}

/* ─── EMPTY / BANNER / TOAST ─── */
.empty-state { padding: 32px 20px; text-align: center; color: var(--grafite); font-size: 13px; }
.empty-state-icon { font-size: 28px; margin-bottom: 8px; }
.view-banner {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 5px;
  font-size: 11.5px; font-weight: 600;
  margin-bottom: 16px;
}
.view-banner.past   { background: var(--areia-lt); color: #8a7558; }
.view-banner.future { background: var(--azul-bg); color: var(--azul); }
.toast {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--carvao); color: var(--branco);
  font-size: 12px; font-weight: 600;
  padding: 10px 20px; border-radius: 4px;
  transition: transform 0.22s ease;
  z-index: 999; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 700px) {
  .layout { grid-template-columns: 1fr; }
  .main { border-right: none; border-bottom: 0.5px solid var(--borda); }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .date-bar { padding: 10px 12px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">BETTER<span>.</span></div>
    <div class="login-sub">Sistema de Demandas</div>
    <input type="password" class="login-input" id="loginSenha" placeholder="Senha de acesso"
           onkeydown="if(event.key==='Enter')entrar()">
    <button class="login-btn" id="loginBtn" onclick="entrar()">Entrar</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div style="display:flex;align-items:center;gap:14px;">

    .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

// ─── HELPERS DE DATA (dias úteis) ────────────────────────────
function parseISO(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function endOfDay(d) {
  const x = new Date(d);
  x.setHours(23, 59, 59, 999);
  return x;
}
function addBusinessDays(date, n) {
  const d = new Date(date);
  let added = 0;
  while (added < n) {
    d.setDate(d.getDate() + 1);
    const wd = d.getDay();
    if (wd !== 0 && wd !== 6) added++;
  }
  return d;
}
function fmtShort(d) {
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-01`;
}
function isStatusDone(raw) {
  return raw === 'done' || (typeof raw === 'string' && raw.indexOf('done|') === 0);
}
function doneDate(raw) {
  return (typeof raw === 'string' && raw.indexOf('done|') === 0) ? raw.split('|')[1] : null;
}

// ─── API ─────────────────────────────────────────────────────
async function api(action, payload = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ senha: SENHA_SESSAO, action, ...payload }),
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.erro || 'erro');
  return data;
}

function setSyncState(state) {
  const badge = document.getElementById('syncBadge');
  const label = document.getElementById('syncLabel');
  badge.className = 'sync-badge ' + state;
  label.textContent = { ok: 'Sincronizado', syncing: 'Sincronizando', err: 'Sem conexão' }[state] || '—';
}

// Envia uma alteração; o servidor devolve os dados atualizados de todos
// Fila SERIAL de gravações. Cada alteração entra na fila e é enviada uma de
// cada vez. Enquanto houver gravações na fila, as respostas do servidor NÃO
// sobrescrevem o STORE local (que já contém a verdade mais recente) — isso
// evita a condição de corrida em que uma resposta antiga "desfazia" uma
// conclusão recém-marcada. O STORE só é ressincronizado quando a fila esvazia.
let writeQueue = [];
let queueRunning = false;

function sync(action, payload) {
  writeQueue.push({ action, payload });
  if (!queueRunning) runQueue();
}

async function runQueue() {
  queueRunning = true;
  setSyncState('syncing');
  while (writeQueue.length) {
    const { action, payload } = writeQueue.shift();
    try {
      const d = await api(action, payload);
      // Só adota o STORE do servidor quando esta foi a ÚLTIMA gravação da fila.
      // Assim respostas intermediárias não rebaixam o estado local.
      if (d.dados && writeQueue.length === 0) {
        STORE = d.dados;
        render();
      }
    } catch (err) {
      setSyncState('err');
      if (String(err.message) === 'senha_invalida') {
        sessionStorage.removeItem('better_senha');
        location.reload();
        return;
      }
      showToast('Erro ao sincronizar — tente novamente');
      // mantém o que falhou para nova tentativa e para a fila
      queueRunning = false;
      return;
    }
  }
  queueRunning = false;
  setSyncState('ok');
}

async function carregarTudo() {
  setSyncState('syncing');
  const d = await api('getAll');
  STORE = d.dados;
  carregado = true;
  setSyncState('ok');
  render();
}

// ─── LOGIN ───────────────────────────────────────────────────
async function entrar() {
  const senha = document.getElementById('loginSenha').value;
  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('loginBtn');
  if (!senha) { msg.textContent = 'Digite a senha.'; msg.className = 'login-msg erro'; return; }

  btn.disabled = true;
  msg.textContent = 'Verificando...';
  msg.className = 'login-msg';

  SENHA_SESSAO = senha;
  try {
    await api('ping');
    sessionStorage.setItem('better_senha', senha);
    document.getElementById('loginScreen').style.display = 'none';
    await carregarTudo();
  } catch (err) {
    SENHA_SESSAO = null;
    btn.disabled = false;
    if (String(err.message) === 'senha_invalida') {
      msg.textContent = 'Senha incorreta.';
    } else {
      msg.textContent = 'Não foi possível conectar. Verifique a internet ou a URL da API.';
    }
    msg.className = 'login-msg erro';
  }
}

async function iniciarSessao() {
  if (SENHA_SESSAO) {
    try {
      await api('ping');
      document.getElementById('loginScreen').style.display = 'none';
      await carregarTudo();
      return;
    } catch (e) {
      sessionStorage.removeItem('better_senha');
      SENHA_SESSAO = null;
    }
  }
  document.getElementById('loginSenha').focus();
}

// ─── HELPERS ─────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function isPast(d) {
  const t = new Date(); t.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  return dd < t;
}
function isFuture(d) {
  const t = new Date(); t.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  return dd > t;
}
function duePassed(due) {
  if (!due) return false;
  const [h, m] = due.split(':').map(Number);
  const now = new Date();
  return now.getHours() > h || (now.getHours() === h && now.getMinutes() >= m);
}
function shortDate(key) {
  const [, m, d] = key.split('-');
  return `${d}/${m}`;
}
function capitalise(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ─── ACESSO AOS DADOS (STORE sincronizado) ───────────────────
function getStatuses(key) { return STORE.statuses[key] || {}; }
function setStatusLocal(key, id, status) {
  if (!STORE.statuses[key]) STORE.statuses[key] = {};
  STORE.statuses[key][id] = status;
}
function removeStatusLocal(key, id) {
  if (STORE.statuses[key]) delete STORE.statuses[key][id];
}
function getCustoms(key) { return STORE.customs[key] || []; }
function getGcalEventId(key, id) { return (STORE.gcal[key] && STORE.gcal[key][id]) || null; }

// ─── GOOGLE OAUTH (AGENDA) ───────────────────────────────────
function initGcal() {
  if (!window.google || !google.accounts) { setTimeout(initGcal, 300); return; }
  gcalTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GCAL_CLIENT_ID,
    scope: GCAL_SCOPE,
    callback: (resp) => {
      if (resp && resp.access_token) {
        gcalAccessToken = resp.access_token;
        sessionStorage.setItem('better_gcal_token', gcalAccessToken);
        updateGcalButton();
        showToast('Agenda conectada ✓');
      }
    },
  });
  const saved = sessionStorage.getItem('better_gcal_token');
  if (saved) { gcalAccessToken = saved; updateGcalButton(); }
}
function updateGcalButton() {
  const btn = document.getElementById('gcalBtn');
  const lbl = document.getElementById('gcalBtnLabel');
  if (gcalAccessToken) { btn.classList.add('connected'); lbl.textContent = 'Agenda conectada'; }
  else { btn.classList.remove('connected'); lbl.textContent = 'Conectar agenda'; }
}
function handleGcalClick() {
  if (!gcalAccessToken) gcalTokenClient.requestAccessToken();
  else showToast('Agenda já conectada');
}
function ensureGcalConnected(callback) {
  if (gcalAccessToken) { callback(); return; }
  gcalTokenClient.callback = (resp) => {
    if (resp && resp.access_token) {
      gcalAccessToken = resp.access_token;
      sessionStorage.setItem('better_gcal_token', gcalAccessToken);
      updateGcalButton();
      callback();
    }
  };
  gcalTokenClient.requestAccessToken();
}
async function createGcalEvent(demand, dateObj, hh, mm) {
  const start = new Date(dateObj);
  start.setHours(hh, mm, 0, 0);
  const end = new Date(start);
  end.setHours(end.getHours() + 1);
  const body = {
    summary: `[${WHO_LABEL[demand.who] || demand.who}] ${demand.title}`,
    description: demand.desc || '',
    start: { dateTime: start.toISOString() },
    end: { dateTime: end.toISOString() },
  };
  const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(GCAL_CALENDAR_ID)}/events`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${gcalAccessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (res.status === 401) {
    gcalAccessToken = null;
    sessionStorage.removeItem('better_gcal_token');
    updateGcalButton();
    throw new Error('auth');
  }
  if (!res.ok) throw new Error('request_failed');
  const data = await res.json();
  return data.id;
}
async function deleteGcalEvent(eventId) {
  const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(GCAL_CALENDAR_ID)}/events/${eventId}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${gcalAccessToken}` },
  });
  if (res.status === 401) {
    gcalAccessToken = null;
    sessionStorage.removeItem('better_gcal_token');
    updateGcalButton();
    throw new Error('auth');
  }
  if (!res.ok && res.status !== 410 && res.status !== 404) throw new Error('request_failed');
}

// ─── MODAIS ──────────────────────────────────────────────────
function showTimePickerModal(demandTitle, defaultTime, onConfirm) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">Adicionar à agenda</div>
      <div class="modal-subtitle">${esc(demandTitle)}</div>
      <div class="modal-row">
        <label class="form-label">Horário</label>
        <input type="time" class="form-input" id="modalTimeInput" value="${defaultTime || '09:00'}">
      </div>
      <div class="modal-actions">
        <button class="modal-btn cancel">Cancelar</button>
        <button class="modal-btn confirm">Adicionar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => document.body.removeChild(overlay);
  overlay.querySelector('.cancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('.confirm').addEventListener('click', () => {
    const val = document.getElementById('modalTimeInput').value || '09:00';
    const [hh, mm] = val.split(':').map(Number);
    close();
    onConfirm(hh, mm);
  });
}
function showConfirmModal(title, subtitle, onConfirm) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">${esc(title)}</div>
      <div class="modal-subtitle">${esc(subtitle)}</div>
      <div class="modal-actions">
        <button class="modal-btn cancel">Cancelar</button>
        <button class="modal-btn danger">Excluir</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => document.body.removeChild(overlay);
  overlay.querySelector('.cancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('.danger').addEventListener('click', () => { close(); onConfirm(); });
}

function toggleGcalForDemand(demand) {
  const dayKey = demand._key;
  const existingEventId = getGcalEventId(dayKey, demand.id);

  if (existingEventId) {
    ensureGcalConnected(() => {
      deleteGcalEvent(existingEventId)
        .then(() => {
          if (STORE.gcal[dayKey]) delete STORE.gcal[dayKey][demand.id];
          sync('clearGcal', { date: dayKey, id: demand.id });
          showToast('Removido da agenda');
          render();
        })
        .catch(() => showToast('Erro ao remover da agenda'));
    });
    return;
  }

  const [y, m, d] = dayKey.split('-').map(Number);
  const eventDate = new Date(y, m - 1, d);

  showTimePickerModal(demand.title, demand.due || '09:00', (hh, mm) => {
    ensureGcalConnected(() => {
      createGcalEvent(demand, eventDate, hh, mm)
        .then((eventId) => {
          if (!STORE.gcal[dayKey]) STORE.gcal[dayKey] = {};
          STORE.gcal[dayKey][demand.id] = eventId;
          sync('setGcal', { date: dayKey, id: demand.id, eventId });
          showToast('Adicionado à agenda ✓');
          render();
        })
        .catch(() => showToast('Erro ao adicionar à agenda'));
    });
  });
}

// ─── MONTAGEM DO DIA ─────────────────────────────────────────
function buildDayRaw(date) {
  const key = dateKey(date);
  const idx = date.getDay();
  const dayName = DAYS[idx];
  const statuses = getStatuses(key);
  const customs = getCustoms(key);

  let list = [];

  if (idx !== 0 && idx !== 6) {
    list = ROTINA
      .filter(d => d.day.includes(dayName))
      .map(d => ({ ...d, status: statuses[d.id] || 'pending', isCustom: false, _key: key }));
  }

  customs.forEach(c => {
    list.push({ ...c, status: statuses[c.id] || 'pending', isCustom: true, _key: key });
  });

  const children = [];
  list.forEach(d => {
    if (d.chain && d.status === 'done') {
      const childId = d.id + '-chain';
      children.push({
        id: childId,
        title: d.chain.next.title,
        desc: d.chain.next.desc,
        who: d.chain.next.who,
        area: d.area,
        due: null,
        status: statuses[childId] || 'waiting',
        isCustom: false,
        isChainChild: true,
        parentTitle: d.title,
        chain: null,
        _key: key,
      });
    }
  });

  return list.concat(children);
}

// Pendências de dias anteriores que migram para hoje como atrasadas.
// `idsDeHoje` = ids que JÁ aparecem na lista de hoje (rotina do dia). Uma
// tarefa que se repete (ex.: as de sexta) não pode ser arrastada de uma
// sexta antiga se hoje também é sexta e ela já está na tela — senão a versão
// velha volta como "atrasada" para sempre, mesmo a de hoje estando concluída.
function getCarryover(today, idsDeHoje) {
  const carried = [];
  const vistos = new Set(idsDeHoje || []); // ids de hoje já contam como "tratados"
  const concluidos = new Set();
  const candidatos = [];

  for (let i = 1; i <= CARRYOVER_DAYS; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const items = buildDayRaw(d);
    items.forEach(item => {
      const isWeeklyRotina = !item.isCustom && !item.isChainChild && item.day && item.day.length < 5;
      const elegivel = item.isChainChild || item.isCustom || isWeeklyRotina;
      if (!elegivel) return;

      if (item.status === 'done') { concluidos.add(item.id); return; }

      if (!vistos.has(item.id)) {
        vistos.add(item.id);
        candidatos.push({ ...item, carried: true, originLabel: shortDate(item._key) });
      }
    });
  }

  candidatos.forEach(c => { if (!concluidos.has(c.id)) carried.push(c); });
  return carried;
}

function buildView(date) {
  let list = buildDayRaw(date);
  const today = isSameDay(date, new Date());

  if (today) {
    list = list.map(d => {
      if (d.status === 'pending' && d.due && duePassed(d.due)) {
        return { ...d, status: 'late', dueLate: true };
      }
      return d;
    });
    // ids que já estão na rotina de hoje — não devem ser arrastados do passado
    const idsDeHoje = list.map(d => d.id);
    list = getCarryover(date, idsDeHoje).concat(list);
  }

  // Tarefas mensais (medições/tabulações) — aparecem dentro da janela do mês
  list = getMonthlyItems(date).concat(list);

  return list;
}

// Gera as tarefas mensais do mês da data visualizada.
// Status é sempre calculado contra a data real de hoje (não a visualizada),
// para que "atrasado" reflita o tempo real, não a navegação.
function getMonthlyItems(viewDate) {
  const y = viewDate.getFullYear();
  const mo = viewDate.getMonth();
  const mKey = monthKey(viewDate);
  const statuses = getStatuses(mKey);
  const realNow = new Date();
  const viewedDay = viewDate.getDate();
  const items = [];

  monthlyDefs().forEach(def => {
    if (viewedDay < def.monthly.start) return; // ainda não apareceu neste mês

    const id = def.base;
    const raw = statuses[id];
    const parentDone = isStatusDone(raw);
    const completedAt = doneDate(raw);

    let status;
    if (parentDone) {
      status = 'done';
    } else {
      const endDate = endOfDay(new Date(y, mo, def.monthly.end));
      status = realNow > endDate ? 'late' : 'pending';
    }

    items.push({
      ...def,
      id,
      _key: mKey,
      isMonthly: true,
      isCustom: false,
      status,
      windowLabel: def.monthly.hardDay ? ('até dia ' + def.monthly.hardDay)
                                        : ('janela ' + def.monthly.start + '–' + def.monthly.end),
    });

    // Encadeamento: tabulação do mesmo prédio para o Leonam, prazo em dias úteis
    if (parentDone && def.chain) {
      const childId = id + '-chain';
      const childRaw = statuses[childId];
      const childDone = isStatusDone(childRaw);
      const baseDate = completedAt ? parseISO(completedAt) : new Date(y, mo, def.monthly.end);
      const childDue = addBusinessDays(baseDate, def.chain.next.dueBusinessDays || 2);

      let cstatus;
      if (childDone) cstatus = 'done';
      else cstatus = realNow > endOfDay(childDue) ? 'late' : 'pending';

      items.push({
        id: childId,
        _key: mKey,
        isMonthly: true,
        isChainChild: true,
        isCustom: false,
        title: def.chain.next.title,
        desc: def.chain.next.desc,
        who: def.chain.next.who,
        area: def.area,
        chain: null,
        status: cstatus,
        parentTitle: def.title,
        windowLabel: 'até ' + fmtShort(childDue),
      });
    }
  });

  return items;
}

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  if (!carregado) return;
  demands = buildView(viewDate);

  const dayIdx = viewDate.getDay();
  document.getElementById('dayBadge').textContent = DAY_NAMES_FULL[dayIdx];
  document.getElementById('dateCurrent').innerHTML =
    `${DAY_NAMES_FULL[dayIdx]}, ${viewDate.getDate()} de ${MONTH_NAMES[viewDate.getMonth()]}<span class="date-year">${viewDate.getFullYear()}</span>`;

  const todayFlag = isSameDay(viewDate, new Date());
  document.getElementById('btnToday').classList.toggle('is-today', todayFlag);

  const banner = document.getElementById('viewBanner');
  if (isPast(viewDate)) {
    banner.innerHTML = `<div class="view-banner past">📋 Visualizando dia passado — registro histórico</div>`;
  } else if (isFuture(viewDate)) {
    banner.innerHTML = `<div class="view-banner future">🔭 Visualizando dia futuro — rotina prevista</div>`;
  } else {
    banner.innerHTML = '';
  }

  document.getElementById('pending-title').textContent =
    todayFlag ? 'A fazer hoje' : (isFuture(viewDate) ? 'Previsto para o dia' : 'Não realizado');
  document.getElementById('done-title').textContent = todayFlag ? 'Concluídas hoje' : 'Concluídas no dia';

  const f = currentFilter;
  const visible = f === 'all' ? demands : demands.filter(d => d.who === f);
  const weekend = (dayIdx === 0 || dayIdx === 6);

  if (weekend && demands.length === 0) {
    ['late','waiting','pending','done'].forEach(s => document.getElementById('section-' + s).style.display = 'none');
    document.getElementById('statsBar').innerHTML = '';
    let extra = isPast(viewDate) ? 'Nenhuma demanda avulsa registrada neste dia.'
      : isFuture(viewDate) ? 'Nenhuma rotina programada. Demandas avulsas podem ser adicionadas no dia.'
      : 'As demandas de segunda aparecem automaticamente na segunda-feira.';
    document.getElementById('viewBanner').innerHTML += `
      <div class="empty-state" style="margin-top:20px;">
        <div class="empty-state-icon">🏖️</div>
        <div style="font-weight:600;margin-bottom:6px;">Fim de semana</div>
        <div>${extra}</div>
      </div>`;
    renderAlerts(visible, todayFlag);
    return;
  }

  const late    = visible.filter(d => d.status === 'late' || d.carried);
  const waiting = visible.filter(d => !d.carried && d.status === 'waiting');
  const pending = visible.filter(d => !d.carried && d.status === 'pending');
  const done    = visible.filter(d => !d.carried && d.status === 'done');

  const all = demands;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-cell"><div class="stat-num red">${all.filter(d => d.status === 'late' || d.carried).length}</div><div class="stat-lbl">Atrasado</div></div>
    <div class="stat-cell"><div class="stat-num yellow">${all.filter(d => !d.carried && d.status === 'waiting').length}</div><div class="stat-lbl">Aguardando</div></div>
    <div class="stat-cell"><div class="stat-num">${all.filter(d => !d.carried && d.status === 'pending').length}</div><div class="stat-lbl">A fazer</div></div>
    <div class="stat-cell"><div class="stat-num green">${all.filter(d => !d.carried && d.status === 'done').length}</div><div class="stat-lbl">Concluído</div></div>
  `;

  renderSection('late', late);
  renderSection('waiting', waiting);
  renderSection('pending', pending);
  renderSection('done', done);

  document.getElementById('section-late').style.display    = late.length ? '' : 'none';
  document.getElementById('section-waiting').style.display = waiting.length ? '' : 'none';
  document.getElementById('section-pending').style.display = pending.length ? '' : 'none';
  document.getElementById('section-done').style.display    = done.length ? '' : 'none';

  if (!late.length && !waiting.length && !pending.length && !done.length) {
    document.getElementById('section-pending').style.display = '';
    document.getElementById('feed-pending').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <div>Nenhuma demanda para este filtro neste dia.</div>
      </div>`;
    document.getElementById('count-pending').textContent = '0';
  }

  renderAlerts(visible, todayFlag);
}

function renderSection(sectionKey, items) {
  document.getElementById('count-' + sectionKey).textContent = items.length;
  const feed = document.getElementById('feed-' + sectionKey);
  if (!items.length) { feed.innerHTML = ''; return; }

  feed.innerHTML = items.map(d => cardHTML(d)).join('');

  items.forEach(d => {
    const domId = d._key + '__' + d.id;
    const cb = document.getElementById('cb-' + domId);
    if (cb && !cb.classList.contains('disabled')) {
      cb.addEventListener('click', () => toggleDemand(d));
    }
    const cal = document.getElementById('cal-' + domId);
    if (cal) cal.addEventListener('click', () => toggleGcalForDemand(d));
    const del = document.getElementById('del-' + domId);
    if (del) del.addEventListener('click', (e) => { e.stopPropagation(); deleteCustomDemand(d); });
  });
}

function cardHTML(d) {
  const isDone = d.status === 'done';
  const domId = d._key + '__' + d.id;

  const whoClass = { mike:'who-mike', leonam:'who-leonam', beatriz:'who-beatriz' }[d.who] || '';
  const displayStatus = d.carried ? 'late' : d.status;
  const sbClass = { pending:'sb-pending', waiting:'sb-waiting', late:'sb-late', done:'sb-done' }[displayStatus];
  const sbLabel = { pending:'A fazer', waiting:'Aguardando', late:'Atrasado', done:'Concluído' }[displayStatus];

  const future = isFuture(viewDate);
  const cbClasses = ['dc-checkbox'];
  if (isDone) cbClasses.push('checked');
  if (future) cbClasses.push('disabled');

  let dueBadge = '';
  if (d.due) {
    const passed = isSameDay(viewDate, new Date()) && !isDone && duePassed(d.due);
    dueBadge = `<span class="dc-due ${passed ? 'passed' : ''}">até ${d.due}</span>`;
  }
  if (d.isMonthly && d.windowLabel) {
    dueBadge = `<span class="dc-due ${d.status === 'late' ? 'passed' : ''}">${d.windowLabel}</span>`;
  }

  const originBadge = d.carried ? `<span class="dc-origin">de ${d.originLabel}</span>` : '';

  let chainFooter = '';
  if (d.chain && !isDone) {
    const nw = d.chain.next.who;
    chainFooter = `<div class="dc-chain">
      <span class="chain-arrow">→</span>
      <span>Ao concluir: <strong class="chain-next-who ${nw}">${WHO_LABEL[nw]}</strong> recebe "${esc(d.chain.next.title)}"</span>
    </div>`;
  }
  if (d.isChainChild) {
    chainFooter = `<div class="dc-chain" style="background:rgba(61,122,94,0.06)">
      <span style="font-size:12px;">🔗</span>
      <span>Ativado por: <strong>${esc(d.parentTitle)}</strong></span>
    </div>`;
  }

  const delBtn = d.isCustom ? `<button class="dc-del" id="del-${domId}" title="Excluir demanda">✕</button>` : '';

  const inCal = !!getGcalEventId(d._key, d.id);
  const calClasses = ['dc-cal-toggle'];
  if (inCal) calClasses.push('in-cal');
  const calCheckClass = inCal ? 'dc-cal-checkbox checked' : 'dc-cal-checkbox';
  const calLabel = inCal ? 'Na agenda' : 'Adicionar à agenda';

  return `<div class="demand-card status-${displayStatus}">
    <div class="dc-main">
      <div class="${cbClasses.join(' ')}" id="cb-${domId}" title="${future ? 'Disponível no dia' : (isDone ? 'Marcar como pendente' : 'Marcar como concluído')}"></div>
      <div class="dc-body">
        <div class="dc-meta">
          <span class="dc-who ${whoClass}">${WHO_LABEL[d.who] || esc(d.who)}</span>
          <span class="dc-area">${esc(d.area)}</span>
          ${d.isCustom ? '<span class="dc-area" style="color:var(--sage);">Avulsa</span>' : ''}
          ${d.isMonthly ? '<span class="dc-area" style="color:#8a7558;">Mensal</span>' : ''}
          ${dueBadge}
          ${originBadge}
          <span class="status-badge ${sbClass}">${sbLabel}</span>
          ${delBtn}
        </div>
        <div class="dc-title">${esc(d.title)}</div>
        ${d.desc ? `<div class="dc-desc">${esc(d.desc)}</div>` : ''}
      </div>
    </div>
    ${chainFooter}
    <div class="${calClasses.join(' ')}" id="cal-${domId}" title="Vincular ao Google Agenda">
      <span class="${calCheckClass}"></span>
      <span>📅 ${calLabel}</span>
    </div>
  </div>`;
}

// ─── TOGGLE ──────────────────────────────────────────────────
function toggleDemand(d) {
  if (d.isMonthly) { toggleMonthly(d); return; }

  const key = d._key; // grava no dia de ORIGEM (mantém o histórico correto)
  const stored = getStatuses(key)[d.id] || (d.isChainChild ? 'waiting' : 'pending');

  if (stored === 'done') {
    const novo = d.isChainChild ? 'waiting' : 'pending';
    setStatusLocal(key, d.id, novo);
    sync('setStatus', { date: key, id: d.id, status: novo });
    // Ao desmarcar o pai, só remove o filho do encadeamento se ele ainda NÃO foi concluído
    if (d.chain) {
      const childId = d.id + '-chain';
      const childStatus = getStatuses(key)[childId];
      if (childStatus && childStatus !== 'done') {
        removeStatusLocal(key, childId);
        sync('removeStatus', { date: key, id: childId });
      }
    }
    showToast('Marcado como pendente');
  } else {
    setStatusLocal(key, d.id, 'done');
    sync('setStatus', { date: key, id: d.id, status: 'done' });
    showToast(d.carried ? `Concluído ✓ (registrado em ${d.originLabel})` : 'Concluído ✓');
    if (d.chain) {
      const childId = d.id + '-chain';
      if (!getStatuses(key)[childId]) {
        setStatusLocal(key, childId, 'waiting');
        sync('setStatus', { date: key, id: childId, status: 'waiting' });
        setTimeout(() => showToast(`→ ${WHO_LABEL[d.chain.next.who]} tem nova tarefa`), 600);
      }
    }
  }
  render();
}

// Toggle de tarefa mensal. Ao concluir, grava a DATA de conclusão junto
// (status 'done|AAAA-MM-DD') para que o prazo da tabulação (2 dias úteis)
// seja calculado a partir do dia real em que o Mike finalizou.
function toggleMonthly(d) {
  const key = d._key; // bucket do mês (AAAA-MM-01)
  const raw = getStatuses(key)[d.id];
  const done = isStatusDone(raw);

  if (done) {
    setStatusLocal(key, d.id, 'pending');
    sync('setStatus', { date: key, id: d.id, status: 'pending' });
    // desfez a medição → remove a tabulação encadeada, se ela ainda não foi concluída
    if (d.chain) {
      const childId = d.id + '-chain';
      const childRaw = getStatuses(key)[childId];
      if (childRaw && !isStatusDone(childRaw)) {
        removeStatusLocal(key, childId);
        sync('removeStatus', { date: key, id: childId });
      }
    }
    showToast('Marcado como pendente');
  } else {
    const val = 'done|' + dateKey(new Date());
    setStatusLocal(key, d.id, val);
    sync('setStatus', { date: key, id: d.id, status: val });
    showToast('Concluído ✓');
    if (d.chain) {
      const childId = d.id + '-chain';
      if (!getStatuses(key)[childId]) {
        setStatusLocal(key, childId, 'pending');
        sync('setStatus', { date: key, id: childId, status: 'pending' });
        setTimeout(() => showToast(`→ ${WHO_LABEL[d.chain.next.who]} tem a tabulação (2 dias úteis)`), 600);
      }
    }
  }
  render();
}

// ─── EXCLUIR AVULSA ──────────────────────────────────────────
function deleteCustomDemand(d) {
  showConfirmModal('Excluir demanda', `"${d.title}" — esta ação não pode ser desfeita.`, () => {
    STORE.customs[d._key] = (STORE.customs[d._key] || []).filter(c => c.id !== d.id);
    removeStatusLocal(d._key, d.id);
    removeStatusLocal(d._key, d.id + '-chain');
    sync('removeCustom', { date: d._key, id: d.id });
    sync('removeStatus', { date: d._key, id: d.id });
    sync('removeStatus', { date: d._key, id: d.id + '-chain' });
    const eventId = getGcalEventId(d._key, d.id);
    if (eventId) {
      if (STORE.gcal[d._key]) delete STORE.gcal[d._key][d.id];
      sync('clearGcal', { date: d._key, id: d.id });
      if (gcalAccessToken) deleteGcalEvent(eventId).catch(() => {});
    }
    showToast('Demanda excluída');
    render();
  });
}

// ─── ALERTAS ─────────────────────────────────────────────────
function renderAlerts(visible, todayFlag) {
  const late    = visible.filter(d => d.status === 'late' || d.carried);
  const waiting = visible.filter(d => !d.carried && d.status === 'waiting');

  let html = '';

  late.forEach(d => {
    const origem = d.carried ? ` (de ${d.originLabel})` : '';
    html += `<div class="alert-item alert-late">
      <div class="alert-icon">🔴</div>
      <div class="alert-text"><strong>${esc(d.title)}</strong>${WHO_LABEL[d.who]} — aguardando ação${origem}</div>
    </div>`;
  });

  waiting.forEach(d => {
    html += `<div class="alert-item alert-waiting">
      <div class="alert-icon">🟡</div>
      <div class="alert-text"><strong>${esc(d.title)}</strong>${WHO_LABEL[d.who]} precisa agir</div>
    </div>`;
  });

  if (todayFlag) {
    const now = new Date();
    const before15 = now.getHours() < 15;
    const prepPendente = visible.some(d =>
      !d.carried && d.status !== 'done' && d.chain && d.chain.next.who === 'beatriz');
    if (before15 && prepPendente) {
      html += `<div class="alert-item alert-15h">
        <div class="alert-icon">⏰</div>
        <div class="alert-text"><strong>Regra das 15h</strong>Há preparação pendente que a Beatriz depende para executar após as 15h.</div>
      </div>`;
    }
  }

  if (!late.length && !waiting.length) {
    html += `<div class="alert-item alert-ok">
      <div class="alert-icon">🟢</div>
      <div class="alert-text"><strong>Tudo em ordem</strong>${todayFlag ? 'Nenhum alerta no momento.' : 'Nenhum alerta para este dia.'}</div>
    </div>`;
  }

  document.getElementById('alertPanel').innerHTML = html;
}

// ─── NOVA DEMANDA AVULSA ─────────────────────────────────────
document.getElementById('f-chain-who').addEventListener('change', function() {
  document.getElementById('chainDetail').style.display = this.value ? 'block' : 'none';
});

function addCustomDemand() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { showToast('Digite uma descrição'); return; }

  const who = document.getElementById('f-who').value;
  const area = document.getElementById('f-area').value;
  const chainWho = document.getElementById('f-chain-who').value;
  const chainAction = document.getElementById('f-chain-action').value.trim();

  const newD = {
    id: 'custom-' + Date.now(),
    title, desc: '', who, area,
    chain: chainWho ? {
      next: {
        who: chainWho,
        title: chainAction || `${capitalise(chainWho)} — verificar`,
        desc: `Ativado por: ${title}`,
      }
    } : null,
  };

  const key = dateKey(viewDate);
  if (!STORE.customs[key]) STORE.customs[key] = [];
  STORE.customs[key].push(newD);
  sync('addCustom', { date: key, demand: newD });

  document.getElementById('f-title').value = '';
  document.getElementById('f-chain-who').value = '';
  document.getElementById('f-chain-action').value = '';
  document.getElementById('chainDetail').style.display = 'none';

  showToast('Demanda adicionada');
  render();
}

// ─── FILTRO ──────────────────────────────────────────────────
function setFilter(f) {
  currentFilter = f;
  localStorage.setItem(FILTER_KEY, f);
  ['all','mike','leonam','beatriz'].forEach(k => {
    const btn = document.getElementById('fb-' + k);
    btn.className = 'filter-btn';
    if (k === f) btn.classList.add('active-' + k);
  });
  render();
}

// ─── NAVEGAÇÃO DE DATA ───────────────────────────────────────
function changeDay(delta) {
  viewDate.setDate(viewDate.getDate() + delta);
  render();
}
function goToday() { viewDate = new Date(); render(); }
function openDatePicker() {
  const picker = document.getElementById('datePicker');
  picker.value = dateKey(viewDate);
  if (picker.showPicker) picker.showPicker(); else picker.click();
}
function onDatePicked(value) {
  if (!value) return;
  const [y, m, d] = value.split('-').map(Number);
  viewDate = new Date(y, m - 1, d);
  render();
}

// ─── TOAST ───────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── START ───────────────────────────────────────────────────
initGcal();
setFilter(currentFilter);
iniciarSessao();

// A cada 60s: busca atualizações dos colegas e reavalia horários-limite.
// Pula se há gravações pendentes na fila, para não sobrescrever o estado local.
setInterval(() => {
  if (!carregado || !SENHA_SESSAO) return;
  if (queueRunning || writeQueue.length) return;
  api('getAll')
    .then(d => { STORE = d.dados; setSyncState('ok'); render(); })
    .catch(() => setSyncState('err'));
}, 60000);
</script>
